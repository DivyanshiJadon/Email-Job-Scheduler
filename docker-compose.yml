services:
  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: reachinbox-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # MySQL is the default driver (DB_CLIENT=mysql). To try Postgres locally
  # instead: docker compose --profile postgres up -d, then set
  # DB_CLIENT=postgres, DB_HOST=localhost, DB_PORT=5433 in backend/.env.local.
  mysql:
    image: mysql:8.4
    container_name: reachinbox-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=reachinbox_root
      - MYSQL_DATABASE=reachinbox
      - MYSQL_USER=reachinbox
      - MYSQL_PASSWORD=reachinbox
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: reachinbox-postgres
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=reachinbox
      - POSTGRES_USER=reachinbox
      - POSTGRES_PASSWORD=reachinbox
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis-data:
  es-data:
  mysql-data:
  pg-data: